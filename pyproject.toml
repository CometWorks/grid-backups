[project]
name = "grid-backups-tests"
version = "0.1.0"
description = "In game tests of the Grid Backups plugin on Magnetar servers, driven through the Remote plugin"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.black]
target-version = ["py312"]
